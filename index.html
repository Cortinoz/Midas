<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon suivi bourse</title>
<style>
  :root { font-family: -apple-system, system-ui, sans-serif; background:#f4f6fa; color:#111827; }
  body { margin:0; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .maj { color:#6b7280; font-size:.8rem; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px){ .grid{grid-template-columns:1fr;} }
  .carte { background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .nom { font-weight:600; font-size:.95rem; }
  .cours { font-size:1.45rem; font-weight:700; margin:6px 0 2px; }
  .var { font-size:.9rem; font-weight:600; }
  .haut { color:#16a34a; } .bas { color:#dc2626; }
  .grille { color:#9ca3af; }
  .indice { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; }
  .indice .var.haut{ color:#86efac; } .indice .var.bas{ color:#fca5a5; }
  button { width:100%; margin-top:14px; padding:12px; border:none; border-radius:12px;
           background:#2563eb; color:#fff; font-size:1rem; font-weight:600; }
  .err { color:#dc2626; font-size:.85rem; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<h1>📈 Mon suivi bourse</h1>
<div class="maj" id="maj">Chargement…</div>
<div class="grid" id="grille"></div>
<button onclick="charger()">🔄 Actualiser</button>
<div class="err" id="err"></div>

<script>
const ACTIONS = [
  { nom:"Crédit Agricole", symbole:"ACA.PA",     indice:false, pm:"17,30 €" },
  { nom:"Getlink",         symbole:"GET.PA",     indice:false, pm:"21,30 €" },
  { nom:"Orange",          symbole:"ORA.PA",     indice:false },
  { nom:"Thales",          symbole:"HO.PA",      indice:false },
  { nom:"Airbus",          symbole:"AIR.PA",     indice:false },
  { nom:"CAC 40",           symbole:"^FCHI",      indice:true  },
  { nom:"Nikkei 225",       symbole:"^N225",      indice:true  },
  { nom:"Dow Jones",       symbole:"^DJI",       indice:true  },
];
const DEVISE = { "^N225":"¥", "^DJI":"$", "^FCHI":" pts" };

async function yahoo(symbole){
  const url = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(symbole) + "?range=1d&interval=1d";
  const url2 = "https://query2.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(symbole) + "?range=1d&interval=1d";
  const essais = [
    { n:"codetabs",  u:"https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url2) },
    { n:"allorigins",u:"https://api.allorigins.win/raw?url=" + encodeURIComponent(url) },
    { n:"corsproxy", u:"https://corsproxy.io/?url=" + encodeURIComponent(url) },
    { n:"direct1",   u:url },
    { n:"direct2",   u:url2 },
  ];
  const erreurs = [];
  for (const e of essais){
    try {
      const r = await fetch(e.u);
      if (!r.ok) { erreurs.push(e.n + ":" + r.status); continue; }
      const t = await r.text();
      const j = JSON.parse(t);
      if (j?.chart?.result?.[0]?.meta?.regularMarketPrice) return j;
      erreurs.push(e.n + ":format");
    } catch (err) { erreurs.push(e.n + ":" + (err.message || "err")); }
  }
  throw new Error(erreurs.join(" "));
}

function affiche(res, a){
  const m = res.chart.result[0].meta;
  const devises = m.currency === "EUR" ? " €" : (DEVISE[a.symbole] || " " + m.currency);
  const prix = m.regularMarketPrice;
  const veille = m.chartPreviousClose ?? m.previousClose ?? prix;
  const diff = prix - veille;
  const pct = veille ? (diff / veille) * 100 : 0;
  const cls = diff >= 0 ? "haut" : "bas";
  const fleche = diff >= 0 ? "▲" : "▼";
  return `<div class="carte ${a.indice ? "indice" : ""}">
    <div class="nom">${a.nom}${a.pm ? ` <span style="font-weight:400;color:#6b7280;font-size:.8rem;">· prix moyen ${a.pm}</span>` : ""}</div>
    <div class="cours">${Number(prix).toLocaleString("fr-FR",{maximumFractionDigits:2})}${devises}</div>
    <div class="var ${cls}">${fleche} ${pct >= 0 ? "+" : ""}${pct.toFixed(2)} %</div>
  </div>`;
}

async function charger(){
  const grille = document.getElementById("grille");
  const err = document.getElementById("err");
  err.textContent = ""; grille.innerHTML = "";
  document.getElementById("maj").textContent = "Chargement…";
  const resultats = await Promise.allSettled(ACTIONS.map(async a => affiche(await yahoo(a.symbole), a)));
  const ok = resultats.filter(r => r.status === "fulfilled");
  grille.innerHTML = ok.map(r => r.value).join("") +
    resultats.filter(r => r.status === "rejected").map(() => `<div class="carte"><div class="nom">—</div><div class="grille">Indisponible</div></div>`).join("");
  document.getElementById("maj").textContent = "Actualisé à " + new Date().toLocaleTimeString("fr-FR");
  if (ok.length === 0) err.textContent = "⚠️ Cours indisponibles — détail : " + resultats.map(r => r.reason?.message || "?").join(" | ");
}
charger();
setInterval(charger, 60000);
</script>
</body>
</html>
